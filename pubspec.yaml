name: dosekeeper
description: "Medication reminder for Android that rings reliably. No account, no server."
publish_to: 'none'

version: 1.1.8+10

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.4.4
  path: ^1.9.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.0
  # Stay on 2.x: 3.x has a native build step that also runs for the Android app build,
  # making it depend on a download from GitHub (a 504 there failed CI). Tests only need this.
  sqlite3: ^2.9.0

flutter:
  uses-material-design: true

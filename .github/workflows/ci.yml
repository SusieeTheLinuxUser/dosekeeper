name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter analyze
      # A zone with DST, so the clock-change tests mean something.
      - run: flutter test
        env:
          TZ: Europe/Warsaw
      # A zone whose spring-forward gap starts at 23:00, so the slot that crosses
      # midnight is really tested (it skips everywhere else).
      - run: flutter test test/dst_test.dart
        env:
          TZ: America/Nuuk

      # Catches native Kotlin build breakage that analyze/test can't see.
      - run: flutter build apk --debug
